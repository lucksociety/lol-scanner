name: daily-scan

on:
  schedule:
    # 12:00 UTC = 08:00 EDT (07:00 EST in winter). GitHub cron is UTC-only and may start a few minutes late.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD, America/New_York). Blank = today ET."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}
      JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Resolve date
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=America/New_York date +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Grade yesterday + 1) FORECAST (frozen before any odds are fetched)
        run: |
          python -m scanner --date "${{ steps.d.outputs.date }}" --stage grade
          python -m scanner --date "${{ steps.d.outputs.date }}" --stage forecast
      - name: Commit frozen forecast first (timestamped in git history before odds exist)
        run: |
          git config user.name "lol-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast_log calibration || true
          git diff --cached --quiet || git commit -m "forecast: freeze ${{ steps.d.outputs.date }}"
      - name: 2) POST-FORECAST edge layer (Jupiter odds)
        run: python -m scanner --date "${{ steps.d.outputs.date }}" --stage edge
        continue-on-error: true
      - name: 3) Dashboard
        run: python -m scanner --date "${{ steps.d.outputs.date }}" --stage dashboard
      - name: Commit odds snapshot + dashboard
        run: |
          git add odds_snapshots edge_log docs || true
          git diff --cached --quiet || git commit -m "edge+dashboard: ${{ steps.d.outputs.date }}"
          git pull --rebase --autostash || true
          git push
