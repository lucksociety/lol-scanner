name: daily-scan

on:
  schedule:
    # 12:00 UTC = 08:00 EDT (07:00 EST in winter). GitHub cron is UTC-only and may start a few minutes late.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD, America/New_York). Blank = today ET."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # first run with a cold gol.gg cache crawls ~2k game pages; later runs are incremental
    env:
      LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}
      JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
      TZ: America/New_York
    steps:
      # Node 24 action majors (Node 20 actions are deprecated on GitHub-hosted runners)
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore gol.gg / Data Dragon cache (model v2 corpus; never committed)
        uses: actions/cache@v5
        with:
          path: .cache
          key: scanner-cache-${{ github.run_id }}
          restore-keys: scanner-cache-
      - name: Seed parsed gol.gg games if the cache is cold (data/golgg_seed.tgz; crawl stays incremental)
        run: |
          mkdir -p .cache && tar xzf data/golgg_seed.tgz -C .cache --skip-old-files
          echo "gol.gg games cached: $(ls .cache/golgg/games | wc -l)"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Resolve date
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=America/New_York date +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Grade yesterday + 1) FORECAST (model v2 primary + v1 baseline; frozen before any odds are fetched)
        run: |
          python -m scanner --date "${{ steps.d.outputs.date }}" --stage grade
          python -m scanner --date "${{ steps.d.outputs.date }}" --stage forecast --model v2
      - name: Commit frozen forecast first (timestamped in git history before odds exist)
        run: |
          git config user.name "lol-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast_log calibration || true
          git diff --cached --quiet || git commit -m "forecast: freeze ${{ steps.d.outputs.date }}"
      - name: 2) POST-FORECAST edge layer (Jupiter odds)
        run: python -m scanner --date "${{ steps.d.outputs.date }}" --stage edge --model v2
        continue-on-error: true
      - name: 3) Dashboard
        run: python -m scanner --date "${{ steps.d.outputs.date }}" --stage dashboard --model v2
      - name: Commit odds snapshot + dashboard
        run: |
          git add odds_snapshots edge_log docs || true
          git diff --cached --quiet || git commit -m "edge+dashboard: ${{ steps.d.outputs.date }}"
          git pull --rebase --autostash || true
          git push
