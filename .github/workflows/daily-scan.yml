name: daily-scan

on:
  push:
    branches: [main]
    paths:
      - scanner/**
      - scripts/model_learning.py
      - .github/workflows/daily-scan.yml
  schedule:
    # 12:00 UTC = 08:00 EDT (07:00 EST in winter). GitHub cron is UTC-only and may start a few minutes late.
    - cron: "0 12 * * *"
    # 19:00 UTC = 15:00 EDT: re-freeze addenda (TBD -> teams set) and refresh odds before the evening slate
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # first run with a cold gol.gg cache crawls ~2k game pages; later runs are incremental
    env:
      LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}
      JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
      TZ: America/New_York
    steps:
      # Node 24 action majors (Node 20 actions are deprecated on GitHub-hosted runners)
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore gol.gg / Data Dragon cache (model v2 corpus; never committed)
        uses: actions/cache@v5
        with:
          path: .cache
          key: scanner-cache-${{ github.run_id }}
          restore-keys: scanner-cache-
      - name: Seed parsed gol.gg games if the cache is cold (data/golgg_seed.tgz; crawl stays incremental)
        run: |
          mkdir -p .cache && tar xzf data/golgg_seed.tgz -C .cache --skip-old-files
          echo "gol.gg games cached: $(ls .cache/golgg/games | wc -l)"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Grade past days + 1) FORECAST every date in the window (today-2 .. today+7 ET; frozen before any odds)
        run: python -m scanner --stage window --model v2 --no-odds
      - name: Commit frozen forecasts first (timestamped in git history before odds exist)
        run: |
          git config user.name "lol-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast_log calibration || true
          git diff --cached --quiet || git commit -m "forecast: freeze window $(TZ=America/New_York date +%F)"
      - name: 2) POST-FORECAST edge layer (Jupiter odds, fetched once) + 3) dashboards for every date
        run: python -m scanner --stage window --model v2
      - name: Commit odds snapshots + dashboards
        run: |
          git add forecast_log calibration odds_snapshots edge_log docs || true
          git diff --cached --quiet || git commit -m "edge+dashboard: window $(TZ=America/New_York date +%F)"
          git pull --rebase --autostash || true
          git push
